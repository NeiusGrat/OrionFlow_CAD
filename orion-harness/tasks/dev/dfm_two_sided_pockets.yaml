task_id: dfm_two_sided_pockets
family: dfm_machinable
pillar: design
split: dev
difficulty: 2
provenance: hand_authored
prompt: |
  Build a 100x50x10mm plate with a 10x10x6mm pocket in its top face
  (floor at z=4) and a 10x6x10mm pocket in its -Y side face (floor at
  y=-19). Both pockets must be reachable without reorienting the part
  more than necessary.
checks:
  - {name: schema_valid, verifier: tier0.schema, kind: gate}
  - {name: single_solid, verifier: tier1.single_solid, kind: gate}
  - {name: watertight, verifier: tier1.watertight, kind: gate}
  - name: top_pocket_accessible
    verifier: tier4.accessibility
    kind: gate
    params: {at: [20, 0, 4], tolerance: 1.5}
  - name: side_pocket_accessible
    verifier: tier4.accessibility
    kind: gate
    params: {at: [0, -19, 3], tolerance: 1.5}
  - {name: rebuild_deterministic, verifier: tier1.rebuild_deterministic, kind: gate}
  - name: wall_min_mm
    verifier: tier4.wall_min
    kind: metric
    target: {min: 1.5}
    weight: 0.5
  - name: setups
    verifier: tier4.setups
    kind: metric
    params: {targets: [[20, 0, 4], [0, -19, 3]], tolerance: 1.5}
    target: {max: 2}
    weight: 0.5
timeout_s: 120
