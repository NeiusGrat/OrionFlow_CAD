# What each part family cannot be built without.
#
# Data, not code, and versioned. Adding a gear, a flange or a sheet-metal
# bracket is an edit here plus one builder in `orion/blueprint_gen.py` — never a
# prompt rewrite. The interview prompt is generated FROM this file, so the two
# cannot drift apart.
#
# Field keys:
#   ask       the question put to the user, verbatim. Not model-generated, so
#             it cannot drift between runs.
#   unit      appended when echoing back; "" for counts, names and threads.
#   diameter  true when the request states a diameter but the Blueprint stores
#             a radius. Halved in Python — never by the model, because a model
#             that halves it sometimes is worse than one that never does.
#   text      true for values that must stay strings (material, thread codes).
#
# REQUIRED means the part is not buildable without it, so a gap becomes a
# question. OPTIONAL means the design is complete without it; asking would be
# noise. That split is the whole reason this file exists: one global
# "is anything missing" rule interrogates a plate about corner radii and lets a
# bearing housing through with no bore.

version: 2

families:

  rect_plate:
    label: rectangular plate
    required:
      length:    {ask: "How long should the plate be?"}
      width:     {ask: "How wide should the plate be?"}
      thickness: {ask: "How thick should it be?"}
    optional:
      material:      {ask: "Material?", unit: "", text: true}
      # Neither shapes geometry — a milled plate and a cast one of the
      # same dimensions are the same solid — but both decide what can
      # be claimed about the part. See orion/dfm.py.
      process:       {ask: "How is it made — machined, cast, printed or sheet?", unit: "", text: true}
      function:      {ask: "What does it do — load bearing, mounting, clearance or enclosure?", unit: "", text: true}
      # A designation the standards table can turn into dimensions.
      motor_frame:   {ask: "Which motor frame does it mount?", unit: "", text: true}
      corner_radius: {ask: "Corner radius?"}
      bore_d:        {ask: "Central bore diameter?", diameter: true}
      # A hole pattern needs a count, a size and a PLACEMENT. Without the last
      # one the builder has nowhere to put the holes and silently placed none:
      # "four M5 clearance holes, one 10 mm from each corner" built a blank
      # plate, and only the feature-fulfillment check caught it.
      hole_count:    {ask: "How many mounting holes?", unit: "",
                      requires: [hole_d],
                      requires_any: [hole_edge_gap, pcd, hole_pitch]}
      # A hole that is named but never placed is the worst of both: the
      # obligation is recorded, the builder has no coordinates so it cuts
      # nothing, and fulfillment then refuses a part nobody was asked a
      # question about. Measured: five of six families accepted "M8 holes"
      # with no placement, asked nothing, and built a solid with none.
      hole_d:        {ask: "Mounting hole diameter?", diameter: true,
                      requires_any: [hole_edge_gap, pcd, hole_pitch]}
      # Every placement slot requires the diameter it places. The pair was
      # only enforced one way: a stated hole size demanded a position, but a
      # stated position demanded no size. Measured on a shelf bracket whose
      # "two M8 holes ... 60 mm apart" lost the M8 in extraction — the pitch
      # was read, claimed the 60 so the unaccounted-dimension guard stayed
      # quiet, raised no obligation because no diameter existed, and the
      # bracket was built with no holes and graded VERIFIED.
      pcd:           {ask: "Bolt circle diameter?", diameter: true,
                      requires: [hole_d]}
      hole_edge_gap: {ask: "How far in from each corner are the mounting holes?",
                      requires: [hole_d]}
      # The third placement: a rectangular grid. Spacing alone does not fix a
      # pattern — nine holes at 30 mm could be 3x3 or 9x1 — so the counts are
      # asked for rather than factored out of hole_count.
      hole_pitch:    {ask: "How far apart are the holes?",
                      requires: [hole_cols, hole_rows, hole_d]}
      hole_cols:     {ask: "How many holes across?", unit: ""}
      hole_rows:     {ask: "How many holes down?", unit: ""}
      thread:        {ask: "Mounting thread size?", unit: "", text: true,
                      requires_any: [hole_edge_gap, pcd, hole_pitch]}
      pocket_l:      {ask: "Pocket length?", requires: [pocket_w, pocket_depth]}
      pocket_w:      {ask: "Pocket width?"}
      pocket_depth:  {ask: "Pocket depth?"}
      # A milled pocket has rounded inside corners whether or not anyone says
      # so — an end mill cannot cut a sharp one — but there was nowhere to put
      # a stated radius. The unaccounted-dimension guard insists every number
      # lands somewhere, so "pocket internal corner radius R3" went into the
      # plate's outer `corner_radius`, gave the plate corners nobody asked for
      # and then collided with the external fillet.
      pocket_corner_radius: {ask: "Pocket inside corner radius?",
                             requires: [pocket_l]}
      # Bosses. Without these a mounting bracket — a plate with two bored
      # bosses on it, which is most of them — matched no builder at all and
      # was refused as an unknown shape.
      #
      # A boss is named by its diameter, so the diameter is what pulls in the
      # rest: a height, because a circle on a face is not a boss, and a count,
      # because the count is what decides whether a position is needed. Same
      # discipline as the hole pattern above, for the same reason — a feature
      # named but never placed is built as nothing and refused later by
      # fulfillment, after the user has answered questions about it.
      boss_d:        {ask: "Boss diameter?", diameter: true,
                      requires: [boss_height, boss_count]}
      boss_height:   {ask: "How far does the boss stand above the base?"}
      boss_count:    {ask: "How many bosses?", unit: "",
                      requires_any: [boss_edge_gap, boss_spacing]}
      boss_hole_d:   {ask: "Boss through-hole diameter?", diameter: true,
                      requires: [boss_d]}
      boss_edge_gap: {ask: "How far in from each end are the boss centres?",
                      requires: [boss_d]}
      boss_spacing:  {ask: "How far apart are the boss centres?",
                      requires: [boss_d]}
      slot_length:   {ask: "Mounting slot length?", requires: [slot_width, slot_edge_gap]}
      slot_width:    {ask: "Mounting slot width?"}
      slot_edge_gap: {ask: "How far are the slots from the plate edge?"}
      fillet:        {ask: "External fillet radius?"}
      chamfer:       {ask: "Edge chamfer size?"}

  # The first family that is neither prismatic nor revolved. The geometry has
  # been verified since the forge work — a module 2.5, 42-tooth gear measures
  # its tip diameter exactly and its profile volume to 2e-15 — but it was never
  # in the builder registry, so every gear request was answered "this part has
  # no deterministic builder".
  spur_gear:
    label: spur gear
    required:
      module:    {ask: "What module is the gear?"}
      teeth:     {ask: "How many teeth?", unit: ""}
      thickness: {ask: "How wide is the gear face?"}
    optional:
      material:       {ask: "Material?", unit: "", text: true}
      # Neither shapes geometry — a milled plate and a cast one of the
      # same dimensions are the same solid — but both decide what can
      # be claimed about the part. See orion/dfm.py.
      process:       {ask: "How is it made — machined, cast, printed or sheet?", unit: "", text: true}
      function:      {ask: "What does it do — load bearing, mounting, clearance or enclosure?", unit: "", text: true}
      bore_d:         {ask: "Bore diameter?", diameter: true}
      pressure_angle: {ask: "Pressure angle in degrees?", unit: "deg"}
      # Carried so it can be REFUSED rather than ignored. A helix angle is not
      # a length, so the unaccounted-dimension guard never sees it: without a
      # slot, "15 degree helix" would build a perfectly good spur gear, pass
      # every assertion and grade VERIFIED with the one thing the user asked
      # for silently absent.
      helix_angle:    {ask: "Helix angle in degrees?", unit: "deg"}

  # The rotational half of mechanical design. One family covers washers,
  # cylinders, tubes, flanges, pulley blanks, shaft collars, spacers, cover
  # discs and grilles, because they are one profile — a disc, optionally bored,
  # optionally holed — extruded. 19 of the 50 benchmark prompts are this shape
  # and none of them had a builder.
  disc:
    label: disc
    required:
      outer_d:   {ask: "What is the outside diameter?", diameter: true}
      thickness: {ask: "How thick is it, or how long for a tube or shaft?"}
    optional:
      material:      {ask: "Material?", unit: "", text: true}
      # Neither shapes geometry — a milled plate and a cast one of the
      # same dimensions are the same solid — but both decide what can
      # be claimed about the part. See orion/dfm.py.
      process:       {ask: "How is it made — machined, cast, printed or sheet?", unit: "", text: true}
      function:      {ask: "What does it do — load bearing, mounting, clearance or enclosure?", unit: "", text: true}
      bore_d:        {ask: "Centre bore diameter?", diameter: true}
      hole_count:    {ask: "How many mounting holes?", unit: "",
                      requires: [hole_d], requires_any: [pcd, hole_pitch]}
      hole_d:        {ask: "Mounting hole diameter?", diameter: true,
                      requires_any: [pcd, hole_pitch]}
      pcd:           {ask: "Bolt circle diameter?", diameter: true,
                      requires: [hole_d]}
      hole_pitch:    {ask: "How far apart are the holes?",
                      requires: [hole_cols, hole_rows, hole_d]}
      hole_cols:     {ask: "How many holes across?", unit: ""}
      hole_rows:     {ask: "How many holes down?", unit: ""}
      thread:        {ask: "Mounting thread size?", unit: "", text: true,
                      requires_any: [pcd, hole_pitch]}

  # Open-topped boxes: enclosures, trays, shelled blocks. Built as a pad with a
  # blind pocket rather than a Thickness feature, so the cavity has an exact
  # closed form and every face keeps its authorship.
  shelled_box:
    label: open-top box
    required:
      length:    {ask: "How long is the box?"}
      width:     {ask: "How wide is the box?"}
      height:    {ask: "How tall is the box?"}
      wall:      {ask: "How thick are the walls?"}
    optional:
      material:  {ask: "Material?", unit: "", text: true}
      # Neither shapes geometry — a milled plate and a cast one of the
      # same dimensions are the same solid — but both decide what can
      # be claimed about the part. See orion/dfm.py.
      process:       {ask: "How is it made — machined, cast, printed or sheet?", unit: "", text: true}
      function:      {ask: "What does it do — load bearing, mounting, clearance or enclosure?", unit: "", text: true}
      floor:     {ask: "How thick is the floor?"}
      corner_radius: {ask: "Corner radius?"}
      # What separates a housing from a box. Each is one cylinder through one
      # wall, so the volume stays a closed form. Without them a gearbox request
      # lost its bores to the unaccounted-dimension guard and was refused
      # whole, which made the commonest reason to want a shelled box
      # unaskable.
      end_bore_d:      {ask: "Shaft bore diameter through the end wall?",
                        diameter: true}
      opposite_bore_d: {ask: "Bore diameter through the opposite end wall?",
                        diameter: true}
      bore_height:     {ask: "How high is the bore axis above the base?",
                        requires_any: [end_bore_d, opposite_bore_d]}
      # How a housing joins its lid. A pad plus a pocket rather than a ring
      # profile: there is no rectangular-ring builder, and this way both areas
      # are exact.
      flange_width:      {ask: "How far does the top flange project beyond the wall?",
                          requires: [flange_thickness]}
      flange_thickness:  {ask: "How thick is the flange?"}
      flange_hole_d:     {ask: "Flange bolt hole diameter?", diameter: true,
                          requires: [flange_width, flange_hole_count]}
      flange_hole_count: {ask: "How many bolt holes in the flange?", unit: "",
                          requires: [flange_hole_d]}
      # Triangular gussets on the long walls. Outside the box and meeting it on
      # one face, so each adds exactly half a prism and the closed form holds.
      rib_count:      {ask: "How many ribs on each long side?", unit: "",
                       requires: [rib_thickness, rib_height]}
      rib_thickness:  {ask: "How thick is each rib?"}
      rib_height:     {ask: "How far up the wall does each rib reach?"}
      rib_projection: {ask: "How far does each rib stand out from the wall?"}
      rib_pitch:      {ask: "How far apart are the rib centres?"}


  l_bracket:
    label: L-bracket
    required:
      base_length:       {ask: "How long is the base plate?"}
      base_width:        {ask: "How wide is the base plate?"}
      base_thickness:    {ask: "How thick is the base plate?"}
      upright_height:    {ask: "How tall is the vertical plate?"}
      # One plate, bent. A single stated thickness is the whole bracket unless
      # the request separately says otherwise.
      upright_thickness: {ask: "How thick is the vertical plate?", mirrors: base_thickness}
    optional:
      material:       {ask: "Material?", unit: "", text: true}
      # Neither shapes geometry — a milled plate and a cast one of the
      # same dimensions are the same solid — but both decide what can
      # be claimed about the part. See orion/dfm.py.
      process:       {ask: "How is it made — machined, cast, printed or sheet?", unit: "", text: true}
      function:      {ask: "What does it do — load bearing, mounting, clearance or enclosure?", unit: "", text: true}
      upright_width:  {ask: "How wide is the vertical plate?"}
      inside_fillet:  {ask: "Inside fillet radius at the joint?"}
      bore_d:         {ask: "Pilot bore diameter on the vertical plate?", diameter: true}
      # ``bolt_square`` places the motor interface on the UPRIGHT. It was the
      # only placement this family had, so a shelf or angle bracket — whose
      # holes go through the BASE so it can be bolted down — had nowhere to put
      # them, and named holes went uncut.
      hole_d:         {ask: "Mounting hole diameter?", diameter: true,
                       requires_any: [bolt_square, base_hole_pitch_x,
                                      base_hole_pitch_y]}
      thread:         {ask: "Mounting thread size?", unit: "", text: true,
                       requires_any: [bolt_square, base_hole_pitch_x,
                                      base_hole_pitch_y]}
      bolt_square:    {ask: "Square bolt pattern spacing?", requires: [hole_d]}
      base_hole_pitch_x: {ask: "Hole spacing along the base?", requires: [hole_d]}
      base_hole_pitch_y: {ask: "Hole spacing across the base?", requires: [hole_d]}
      cbore_d:        {ask: "Counterbore diameter?", diameter: true, requires: [cbore_depth]}
      cbore_depth:    {ask: "Counterbore depth?"}
      slot_length:    {ask: "Mounting slot length?"}
      slot_width:     {ask: "Mounting slot width?"}
      slot_count:     {ask: "How many mounting slots?", unit: ""}
      slot_edge_gap:  {ask: "Slot distance from the plate edge?"}
      fillet:         {ask: "External fillet radius?"}
      chamfer:        {ask: "Edge chamfer size?"}

  bearing_housing:
    label: bearing housing
    required:
      length:     {ask: "What is the overall length?"}
      width:      {ask: "What is the overall width?"}
      height:     {ask: "What is the overall height?"}
      bore_d:     {ask: "What is the bearing seat diameter?", diameter: true}
      seat_depth: {ask: "How deep is the bearing seat?"}
    optional:
      material:       {ask: "Material?", unit: "", text: true}
      # Neither shapes geometry — a milled plate and a cast one of the
      # same dimensions are the same solid — but both decide what can
      # be claimed about the part. See orion/dfm.py.
      process:       {ask: "How is it made — machined, cast, printed or sheet?", unit: "", text: true}
      function:      {ask: "What does it do — load bearing, mounting, clearance or enclosure?", unit: "", text: true}
      bearing_series: {ask: "Which bearing series?", unit: "", text: true}
      mounting_type:  {ask: "Mounting style (foot or flange)?", unit: "", text: true}
      shoulder:       {ask: "Locating shoulder width?"}
      recess_d:       {ask: "Flange recess diameter?", diameter: true, requires: [recess_depth]}
      recess_depth:   {ask: "Flange recess depth?"}
      hole_d:         {ask: "Mounting hole diameter?", diameter: true,
                       requires_any: [hole_pitch_x, hole_pitch_y]}
      thread:         {ask: "Mounting thread size?", unit: "", text: true,
                       requires_any: [hole_pitch_x, hole_pitch_y]}
      hole_pitch_x:   {ask: "Hole spacing along the length?", requires: [hole_d]}
      hole_pitch_y:   {ask: "Hole spacing across the width?", requires: [hole_d]}
      fillet:         {ask: "Fillet radius where the feet meet the body?"}
      chamfer:        {ask: "Edge chamfer size?"}

  manifold:
    label: valve manifold
    required:
      length:    {ask: "What is the overall length?"}
      width:     {ask: "What is the overall width?"}
      height:    {ask: "What is the overall height?"}
      passage_d: {ask: "What diameter is the main passage?", diameter: true}
    optional:
      material:      {ask: "Material?", unit: "", text: true}
      # Neither shapes geometry — a milled plate and a cast one of the
      # same dimensions are the same solid — but both decide what can
      # be claimed about the part. See orion/dfm.py.
      process:       {ask: "How is it made — machined, cast, printed or sheet?", unit: "", text: true}
      function:      {ask: "What does it do — load bearing, mounting, clearance or enclosure?", unit: "", text: true}
      port_count:    {ask: "How many ports?", unit: ""}
      port_thread:   {ask: "Port thread size?", unit: "", text: true}
      port_d:        {ask: "Port tapping drill diameter?", diameter: true}
      inlet_thread:  {ask: "Inlet thread size?", unit: "", text: true}
      hole_d:        {ask: "Mounting hole diameter?", diameter: true, requires: [hole_edge_gap]}
      hole_edge_gap: {ask: "How far are the mounting holes from the block edge?",
                     requires: [hole_d]}
      thread:        {ask: "Mounting thread size?", unit: "", text: true}
      cbore_d:       {ask: "Counterbore diameter?", diameter: true, requires: [cbore_depth]}
      cbore_depth:   {ask: "Counterbore depth?"}
      fillet:        {ask: "External fillet radius?"}
      chamfer:       {ask: "Edge chamfer size?"}

  # ------------------------------------------------------------------------ #
  # Assemblies
  # ------------------------------------------------------------------------ #
  # Many parts, placed, with their mates checked. These are not compiled by
  # `blueprint_gen` — each is a catalogue spec in `orion/assembly_spec.py` that
  # resolves to a set of component Blueprints, and `app/services/
  # assembly_service.py` builds them. They live in this file anyway because the
  # interview prompt is generated FROM it, so an assembly is asked about the
  # same way a part is and cannot drift from its schema.
  #
  # What an assembly proves that a part cannot: non-interference, exactly. If
  # no two components share space the fused volume equals the sum of the
  # component volumes, so the deficit IS the interpenetration. That check found
  # a real bug the first time it ran here — `bolted_joint` placed every bolt
  # after the first at the same coordinate.

  bolted_joint:
    label: bolted joint
    required:
      d:        {ask: "What bolt diameter?"}
      plate_t:  {ask: "How thick is each plate?"}
    optional:
      n_bolts:  {ask: "How many bolts?", unit: ""}
      cls:      {ask: "Bolt strength class?", unit: "", text: true}

  bearing_stack:
    label: bearing stack
    required:
      bore:      {ask: "What is the bearing bore?"}
    optional:
      ring_t:    {ask: "How thick are the bearing rings?"}
      ball_gap:  {ask: "What is the ball gap?"}
      width:     {ask: "How wide is the bearing?"}
      shaft_len: {ask: "How long is the shaft?"}

  planetary_stage:
    label: planetary gear stage
    required:
      module:      {ask: "What module are the gears?"}
      z_sun:       {ask: "How many teeth on the sun?", unit: ""}
      z_planet:    {ask: "How many teeth on each planet?", unit: ""}
      n_planets:   {ask: "How many planets?", unit: ""}
    optional:
      face_width:  {ask: "How wide is each gear in the stage?"}
      sun_bore:    {ask: "What is the sun bore?"}
      planet_bore: {ask: "What is each planet bore?"}

  belt_drive:
    label: belt drive
    required:
      d1:      {ask: "What is the driving pulley diameter?"}
      d2:      {ask: "What is the driven pulley diameter?"}
      centres: {ask: "What is the centre distance?"}
    optional:
      width:   {ask: "How wide are the pulleys?"}
      bore1:   {ask: "What is the driving pulley bore?"}
      bore2:   {ask: "What is the driven pulley bore?"}

  lead_screw_drive:
    label: lead screw drive
    required:
      d:       {ask: "What is the screw diameter?"}
      length:  {ask: "How long is the screw?"}
    optional:
      starts:  {ask: "How many thread starts?", unit: ""}
      nut_od:  {ask: "What is the nut outside diameter?"}
      nut_len: {ask: "How long is the nut?"}
      travel:  {ask: "How much travel is needed?"}

  spring_plunger:
    label: spring plunger
    required:
      wire_d:     {ask: "What is the spring wire diameter?"}
      coil_d:     {ask: "What is the coil mean diameter?"}
      free_len:   {ask: "What is the spring free length?"}
    optional:
      n_active:   {ask: "How many active coils?", unit: ""}
      plunger_d:  {ask: "What is the plunger diameter?"}
      bore_d:     {ask: "What is the housing bore?"}
      preload_mm: {ask: "How much preload?"}
      stroke:     {ask: "What stroke is needed?"}

  keyed_coupling:
    label: keyed coupling
    required:
      shaft_d:   {ask: "What is the shaft diameter?"}
      hub_od:    {ask: "What is the hub outside diameter?"}
    optional:
      hub_len:   {ask: "How long is the hub?"}
      shaft_len: {ask: "How long is the shaft?"}
      torque_nm: {ask: "What torque must it carry, in Nm?", unit: "Nm"}

  four_bar:
    label: four-bar linkage
    required:
      ground:    {ask: "How long is the ground link?"}
      crank:     {ask: "How long is the crank?"}
      coupler:   {ask: "How long is the coupler?"}
      rocker:    {ask: "How long is the rocker?"}
    optional:
      theta_deg: {ask: "At what crank angle, in degrees?", unit: "deg"}
      link_w:    {ask: "How wide is each link?"}
      link_t:    {ask: "How thick is each link?"}
      hole_r:    {ask: "What is the pin hole radius?"}
